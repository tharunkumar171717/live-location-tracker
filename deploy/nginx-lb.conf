# Load balancer for the two API instances in docker-compose.yml.
# Plain round robin: a WebSocket stays on the instance it connected to, and
# Redis pub/sub carries events between instances, so no sticky sessions needed.
upstream api {
  server api1:4000;
  server api2:4000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;

  location / {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Shows which instance answered, handy for watching the round robin.
    add_header X-Upstream $upstream_addr always;
  }

  location /ws {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
}
