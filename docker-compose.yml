# Full stack on one machine, scaled out:
#   Postgres + Redis + two API instances behind an nginx load balancer + web.
#
#   docker compose up --build
#   open http://localhost:3000/demo      (live demo, no sign-in)
#
# Signing in needs a Supabase project: put SUPABASE_URL,
# SUPABASE_PUBLISHABLE_KEY (and optionally SUPABASE_JWT_SECRET) in a .env
# file next to this one. Without them, the demo and share pages still work.

x-api: &api
  build: ./server
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  environment:
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
    DB_SSL: 'false'
    REDIS_URL: redis://redis:6379
    SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
    SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-local}
    SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
    CORS_ORIGINS: http://localhost:3000
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 20

  migrate:
    build: ./server
    command: ['node', 'scripts/migrate.js', '--local']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      DB_SSL: 'false'
      SUPABASE_URL: http://unused
      SUPABASE_PUBLISHABLE_KEY: unused

  api1: *api
  api2: *api

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api1, api2]
    ports:
      - '8080:8080'

  web:
    build:
      context: ./web
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-local}
        VITE_API_URL: http://localhost:8080
        VITE_WS_URL: ws://localhost:8080/ws
    depends_on: [lb]
    ports:
      - '3000:80'

volumes:
  pgdata:
